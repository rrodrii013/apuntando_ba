<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Apuntando la Bateria</title>
</head>
<body>

    <!-- Panel de decisión del método de puntería--> 
    <div class="decision_metodo">
        <h1>Selecciona el método por el que deseas apuntar:</h1>
        <button class="btn_angulo_vigilancia" onclick="choosenAnguloVigilancia()">Apuntar por Ángulo de Vigilancia</button>
        <button class="btn_orientacion" onclick="choosenOrientacion()">Apuntar por una Orientación</button>
    </div>

    <!-- Panel Puntería por Angulo de Vigilancia-->
  <div class="panel panel-1" id="panel1">
    <h2> Calculo por Angulo de Vigilancia</h2>
 
    <div class="field">
      <label for="p1_campo1">Ingresa las coordenadas de PV:</label>
        <input type="number"  id="coordenadas_x_pv_str" placeholder="X:"/> 
        <input type="number"  id="coordenadas_y_pv_str" placeholder="Y:"/><span>recuerda que la coordenada debe ser de 6 digitos</span>
    </div>
    <div class="field">
      <label for="p1_campo2">Ingresa las coordenadas de CB:</label>
      <input type="number"  id="coordenadas_x_cb_str" placeholder="X:">
      <input type="number"  id="coordenadas_y_cb_str" placeholder="Y:"/>
    </div>
    <div class="field">
      <label for="p1_campo3">Ingresa las coordenadas de DR:</label>
      <input type="number"  id="coordenadas_x_dr_str" placeholder="X:">
      <input type="number"  id="coordenadas_y_dr_str" placeholder="Y:"/>
    </div>
    
<script src="/mi_bateria/static/punteria_por_av.js"></script>
<script src="/mi_bateria/static/punteria_por_orientacion.js"></script>
</body>
</html>
